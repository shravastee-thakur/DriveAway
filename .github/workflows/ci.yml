name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node ${{matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json
      - name: Prove Node arrived
        run: node --version
      - name: Install dependencies
        working-directory: Backend
        run: npm ci
      - name: Prove installed worked
        working-directory: Backend
        run: npm ls express
      - name: Run tests
        working-directory: Backend
        env:
          ACCESS_SECRET: ${{secrets.ACCESS_SECRET}}
          REFRESH_SECRET: ${{secrets.REFRESH_SECRET}}
        run: npm run test
      - name: Build docker image
        run: docker build -f Backend/Dockerfile -t driveaway-backend:ci Backend
      - name: Log in to Github Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Tag and push image
        run: |
          docker tag driveaway-backend:ci ghcr.io/shravastee-thakur/driveaway-backend:${{ github.sha }}
          docker push ghcr.io/shravastee-thakur/driveaway-backend:${{ github.sha }}